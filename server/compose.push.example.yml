# Optional FCM overlay; only use after placing the real key on the server.
# docker compose -f docker-compose.yml -f compose.push.example.yml up -d --build
services:
  chat:
    environment:
      FCM_SERVICE_ACCOUNT_FILE: /run/secrets/fcm_service_account
    secrets:
      - fcm_service_account
secrets:
  fcm_service_account:
    file: ./secrets/fcm-service-account.json
